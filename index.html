<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Chủ </title>
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/components/header.css">
    <link rel="stylesheet" href="css/components/footer.css">
    <link rel="stylesheet" href="css/pages/home.css">
</head>
<body>

    <!-- ================= HEADER ================= -->
    <header class="header">
        <div class="header-container">
            <!-- Navigation Menu -->
            <nav class="nav-menu">
                <a href="#" class="nav-link active">Trang chủ</a>
                <a href="#" class="nav-link">Chức năng 1</a>
                <a href="#" class="nav-link">Chức năng 2</a>
            </nav>

            <!-- User Profile Pill -->
            <div class="user-profile">
                <div class="avatar-circle">F</div>
                <div class="user-info">
                    <span class="user-name">Hoàng Quốc Đạt</span>
                    <span class="user-role">Sinh viên</span>
                </div>
            </div>
        </div>
    </header>

    <!-- ================= MAIN CONTENT ================= -->
    <main class="main-content">
        <!-- Khối chứa nền trắng mờ ở giữa -->
        <div class="content-overlay">
            <h1 class="section-title">các bước thực hiện</h1>
        </div>
    </main>

    <!-- ================= FOOTER ================= -->
    <footer class="footer">
        <div class="footer-container">
            <!-- Cột liên kết -->
            <div class="footer-links">
                <h3 class="footer-heading">Liên kết nhanh</h3>
                <ul class="link-list">
                    <li><a href="#">Trang chủ</a></li>
                    <li><a href="#">Chức năng 1</a></li>
                    <li><a href="#">Chức năng 2</a></li>
                </ul>
            </div>

            <!-- Cột Logo -->
            <div class="footer-logo">
                <!-- Thay src bằng link logo Bách Khoa thực tế của bạn -->
                <img src="assets/image/uploads2Flogo.webp" alt="Đại học Bách Khoa Logo">
            </div>
        </div>
    </footer>

</body>
</html>
